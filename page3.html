<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: "Georgia", serif;
            background-image: url("cute2.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            text-align:center;
            background:rgba(255,255,255,0.80);
            padding:60px 70px;
            border-radius:20px;
            backdrop-filter: blur(4px);
        }

        h1{
            font-size:3rem;
            color:#333;
            font-weight:normal;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>I miss you, I can't wait to see you cutie!</h1>
    </div>

</body>
</html>
