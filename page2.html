<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: "Georgia", serif;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            background:white;
        }

        .background-image{
            position:absolute;
            width:100%;
            height:100%;
            object-fit:contain;
            object-position:center;
            z-index:0;
        }

        .container{
            position:relative;
            z-index:1;

            text-align:center;
            background:rgba(255,255,255,0.80);
            padding:60px 70px;
            border-radius:20px;
            backdrop-filter: blur(4px);

            transform: translateY(250px);
        }

        h1{
            font-size:3rem;
            color:#333;
            margin-bottom:40px;
            font-weight:normal;
        }

        button{
            padding:16px 40px;
            font-size:1.2rem;
            border:none;
            border-radius:999px;
            cursor:pointer;

            background:#ff5d8f;
            color:white;

            transition:0.25s;
        }

        button:hover{
            transform:scale(1.05);
            background:#ff3d79;
        }
    </style>
</head>

<body>

    <img class="background-image" src="cute.JPG">

    <div class="container">
        <h1>I love you ❤️</h1>

        <button onclick="nextPage()">
            Continue →
        </button>
    </div>

    <script>
        function nextPage() {
            window.location.href = "page3.html";
        }
    </script>

</body>
</html>
